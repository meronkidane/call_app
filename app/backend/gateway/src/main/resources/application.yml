server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  data:
    mongodb:
      database: streamhub
      auto-index-creation: true
  redis:
    host: localhost
    port: 6379
logging:
  level:
    root: INFO
    com.streamhub: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
