server:
  port: 8085
  shutdown: graceful
spring:
  application:
    name: billing-service
  data:
    mongodb:
      database: streamhub
      auto-index-creation: true
  redis:
    host: localhost
    port: 6379
security:
  mock-auth:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
