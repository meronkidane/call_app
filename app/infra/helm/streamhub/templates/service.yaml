{{- range $svc := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "streamhub.fullname" $ }}-{{ $svc.name }}
  labels:
    app: {{ include "streamhub.fullname" $ }}-{{ $svc.name }}
    {{- include "streamhub.labels" $ | nindent 4 }}
spec:
  selector:
    app: {{ include "streamhub.fullname" $ }}-{{ $svc.name }}
  ports:
    - name: http
      port: {{ $svc.containerPort | default 8080 }}
      targetPort: http
      protocol: TCP
  type: ClusterIP
{{- end }}
