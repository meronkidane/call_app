version: "3.9"

services:
  mongo:
    image: mongo:7.0
    container_name: streamhub-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: streamhub
    volumes:
      - mongo-data:/data/db
    networks:
      - streamhub

  redis:
    image: redis:7.4
    container_name: streamhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - streamhub

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: streamhub-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - streamhub

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: streamhub-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - streamhub

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: streamhub-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - streamhub

  minio:
    image: minio/minio:latest
    container_name: streamhub-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: streamhub
      MINIO_ROOT_PASSWORD: streamhub123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - streamhub

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: streamhub-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=streamhub123
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - streamhub

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.15.0
    container_name: streamhub-opensearch-dashboards
    restart: unless-stopped
    depends_on:
      - opensearch
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    networks:
      - streamhub

  mailhog:
    image: mailhog/mailhog:latest
    container_name: streamhub-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - streamhub

volumes:
  mongo-data:
  redis-data:
  minio-data:

networks:
  streamhub:
    driver: bridge
