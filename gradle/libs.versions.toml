[versions]
springBoot = "3.3.2"
springDependencyManagement = "1.1.5"
reactorKafka = "1.3.22"
springdoc = "2.5.0"
testcontainers = "1.20.2"
jackson = "2.17.2"
reactor = "3.6.6"
embeddedRedis = "0.13.0"
resilience4j = "2.2.0"

[libraries]
springBootStarterWebflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
springBootStarterSecurity = { module = "org.springframework.boot:spring-boot-starter-security" }
springBootStarterValidation = { module = "org.springframework.boot:spring-boot-starter-validation" }
springBootStarterDataMongodb = { module = "org.springframework.boot:spring-boot-starter-data-mongodb-reactive" }
springBootStarterActuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
springBootStarterOauth2ResourceServer = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
springBootStarterLogging = { module = "org.springframework.boot:spring-boot-starter-logging" }
springdocOpenapi = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc" }
reactorKafka = { module = "io.projectreactor.kafka:reactor-kafka", version.ref = "reactorKafka" }
resilience4jReactor = { module = "io.github.resilience4j:resilience4j-reactor", version.ref = "resilience4j" }
resilience4jSpringBoot3 = { module = "io.github.resilience4j:resilience4j-spring-boot3", version.ref = "resilience4j" }
jacksonDatatypeJsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
reactorTest = { module = "io.projectreactor:reactor-test", version.ref = "reactor" }
springBootStarterTest = { module = "org.springframework.boot:spring-boot-starter-test" }
testcontainersJunit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainersMongodb = { module = "org.testcontainers:mongodb", version.ref = "testcontainers" }
testcontainersRedis = { module = "org.testcontainers:redis", version.ref = "testcontainers" }
testcontainersKafka = { module = "org.testcontainers:kafka", version.ref = "testcontainers" }
embeddedRedis = { module = "it.ozimov:embedded-redis", version.ref = "embeddedRedis" }

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
