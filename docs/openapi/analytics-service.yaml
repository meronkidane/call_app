openapi: 3.1.0
info:
  title: StreamHub Analytics Service API
  version: 0.1.0
servers:
  - url: http://localhost:8087
    description: Local development
paths:
  /analytics/events:
    post:
      summary: Ingest a batch of analytics events
      tags: [Events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsEventRequest'
      responses:
        '200':
          description: Events accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /analytics/summary:
    get:
      summary: Retrieve key analytics metrics
      tags: [Analytics]
      responses:
        '200':
          description: Summary metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummaryEnvelope'
components:
  schemas:
    AnalyticsEventRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventPayload'
    EventPayload:
      type: object
      required: [type]
      properties:
        type:
          type: string
        userId:
          type: string
        profileId:
          type: string
        device:
          type: string
        contentId:
          type: string
        timestamp:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
    AnalyticsSummaryResponse:
      type: object
      properties:
        dailyActiveUsers:
          type: integer
          format: int64
        monthlyActiveUsers:
          type: integer
          format: int64
        totalPlaytimeMinutes:
          type: integer
          format: int64
        completionRate:
          type: number
          format: float
        topTitle:
          type: string
    AnalyticsSummaryEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AnalyticsSummaryResponse'
        metadata:
          $ref: '#/components/schemas/Metadata'
    Metadata:
      type: object
      properties:
        status:
          type: string
        code:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
          nullable: true
    EmptyResponse:
      type: object
      properties:
        data:
          nullable: true
        metadata:
          $ref: '#/components/schemas/Metadata'
